aid: freecurrencyapi
name: Free Currency API
description: >-
  Free Currency API provides real-time and historical currency exchange rate
  data for 150+ currencies via a simple REST API. No registration is required
  for basic usage, making it ideal for hobby and development projects. The API
  offers daily-updated current exchange rates, historical rates dating back to
  1999, and multi-currency support with official SDKs for JavaScript, Python,
  PHP, Go, Ruby, Rust, C#, and R.
